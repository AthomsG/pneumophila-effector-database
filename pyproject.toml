[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legionella-effectors"
version = "0.1.0"
description = "A small, refreshable catalogue of Legionella effectors"
requires-python = ">=3.10"

[project.scripts]
legionella-effectors = "legionella_effectors.cli:main"

[tool.setuptools.packages.find]
include = ["legionella_effectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
